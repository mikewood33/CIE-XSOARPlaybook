inputs:
- key: Devices
  value:
    simple: ""
  required: false
  description: 'Firewall names and Panorama serials, for example edge-fw:012345678901,core-fw:012345678902. Leave empty to query the integration instance itself.'
  playbookInputQuery:
- key: Using
  value:
    simple: ""
  required: false
  description: PAN-OS or Panorama integration instance name. Leave empty to use the default enabled instance.
  playbookInputQuery:
- key: ApiCommand
  value:
    simple: panorama
  required: false
  description: panorama when the instance is Panorama. pan-os when the instance is a single firewall.
  playbookInputQuery:
- key: UseTarget
  value:
    simple: "true"
  required: false
  description: 'Pass each serial as the API target. true for Panorama. false for a firewall instance.'
  playbookInputQuery:
- key: SyncMaxAgeMinutes
  value:
    simple: "60"
  required: false
  description: Alert when the newest CIE sync evidence on a firewall is at least this many minutes old.
  playbookInputQuery:
- key: SyslogMaxAgeMinutes
  value:
    simple: "60"
  required: false
  description: Alert when no CIE syslog heartbeat is seen for this many minutes.
  playbookInputQuery:
- key: SyslogHeartbeatSource
  value:
    simple: xsoar-incidents
  required: false
  description: xsoar-incidents, pan-os-log, xsiam-xql, or disabled.
  playbookInputQuery:
- key: SyslogHeartbeatQuery
  value:
    simple: 'type:"CIE Syslog"'
  required: false
  description: Incident query, PAN-OS system-log filter, or XQL query that should return at least one CIE syslog event per window.
  playbookInputQuery:
- key: DeviceTimeOffsetMinutes
  value:
    simple: "0"
  required: false
  description: 'Minutes to add to UTC to match the firewall clock. Use 0 when the firewall uses UTC. US Eastern Standard Time is -300.'
  playbookInputQuery:
- key: NotifyEmail
  value:
    simple: ""
  required: false
  description: Email address for the alert summary. Leave empty to skip email.
  playbookInputQuery:
- key: AlertIncidentType
  value:
    simple: CIE Sync Failure
  required: false
  description: Incident type opened when a finding is detected. Do not attach this playbook to that type.
  playbookInputQuery:
- key: StateListName
  value:
    simple: CIE-Sync-Monitor-State
  required: false
  description: XSOAR list that stores the previous CIE update counters.
  playbookInputQuery:
- key: CheckFirewallLogs
  value:
    simple: "true"
  required: false
  description: Query system logs for cas-message and syslog-conn-status failures.
  playbookInputQuery:
- key: QueryEachDevice
  value:
    simple: "false"
  required: false
  description: Query system logs on each firewall serial. Leave false to query the Panorama log database once.
  playbookInputQuery:
outputs:
- contextPath: CIE.Health.Status
  description: Healthy or Alert.
- contextPath: CIE.Health.AlertIncidentID
  description: Open CIE Sync Failure incident for this run.
- contextPath: CIE.Health.Summary
  description: Markdown report for the run.
tests:
- No tests
fromversion: 6.10.0
marketplaces:
- xsoar
- marketplacev2

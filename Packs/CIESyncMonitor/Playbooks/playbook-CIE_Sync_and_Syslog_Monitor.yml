description: 'Hourly Cloud Identity Engine check. Alerts when an NGFW has not synced CIE directory data within the threshold, when the firewall logs a CIE or syslog failure, or when expected CIE syslog stops. The job incident closes after every run so the next hour can start. Findings stay open on a separate CIE Sync Failure incident.'
